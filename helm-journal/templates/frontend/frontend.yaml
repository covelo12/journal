apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicas}}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
        - name: password-volume
          secret:
            secretName: redis-password
      containers:
      - image: "{{ .Values.frontend.image.repository}}:{{ .Values.frontend.image.tag}}"
        imagePullPolicy: Always
        name: frontend
        resources:
          requests:
            cpu: "1.0"
            memory: "1G"
          limits:
            cpu: "1.0"
            memory: "1G"
        volumeMounts:
          - name : password-volume
            readOnly: true 
            mountPath: "/etc/redis-passwd"
      restartPolicy: Always
  
